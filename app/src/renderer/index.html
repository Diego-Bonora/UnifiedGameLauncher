<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>%APP_NAME%</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         img-src will need widening (or a main-side cover cache) once cover art loads.
         'unsafe-inline' styles are kept for Vite dev; revisit for production. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# appId must equal APP_ID and productName must equal APP_NAME (src/shared/app-info.ts).
appId: io.github.diego-bonora.unifiedgamelauncher
productName: UnifiedGameLauncher
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!{electron.vite.config,vitest.config}.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
win:
  executableName: UnifiedGameLauncher
  target:
    - target: nsis
      arch: x64
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Updates are read from GitHub Releases (electron-updater is added in Milestone 7).
publish:
  provider: github
  owner: Diego-Bonora
  repo: UnifiedGameLauncher

# appId must equal APP_ID and productName must equal APP_NAME (src/shared/app-info.ts).
appId: io.github.diego-bonora.unifiedgamelauncher
productName: UnifiedGameLauncher
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!{electron.vite.config,vitest.config}.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.nvmrc,scripts/**}'
  # Build-time record for the licenses list, not app code.
  - '!out/bundled-packages/**'
  # Shipped once, outside app.asar (extraResources below).
  - '!out/licenses/**'
# License texts of every shipped package (scripts/licenses.mjs), next to the
# app as resources\licenses. Electron's own license files ship by default.
extraResources:
  - from: out/licenses
    to: licenses
win:
  executableName: UnifiedGameLauncher
  target:
    - target: nsis
      arch: x64
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Where electron-updater looks for updates: electron-builder writes this into
# the installed app as app-update.yml, and nothing else can change it. No code
# signing is configured, so app-update.yml has no publisherName and updates'
# signatures aren't checked; adding signing turns that check on by itself.
publish:
  provider: github
  owner: Diego-Bonora
  repo: UnifiedGameLauncher
